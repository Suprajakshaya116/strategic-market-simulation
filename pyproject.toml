[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "strategic-market-simulation"
version = "0.1.0"
description = "Game-Theoretic Multi-Agent Reinforcement Learning for Strategic Trading"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "gymnasium>=0.29",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["environment*", "agents*", "game_theory*", "rl*", "experiments*", "analysis*"]
